<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام الحسابات والعمالة اليومية</title>
  <style>
    :root {
      --bg-dark: #0c0e12;
      --card-bg: #151921;
      --card-sub: #1b212c;
      --accent-gold: #d4af37;
      --gold-hover: #e5c158;
      --text-main: #f0f4f8;
      --text-muted: #8b949e;
      --border-color: #272f3d;
      --bubble-bot: #192231;
      --bubble-user: #2c2518;
      --present-color: #2ecc71;
      --absent-color: #e74c3c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-title { font-size: 1rem; font-weight: bold; color: var(--accent-gold); }
    .status-badge { font-size: 0.75rem; background: rgba(39, 174, 96, 0.15); color: #2ecc71; border: 1px solid rgba(39, 174, 96, 0.3); padding: 3px 10px; border-radius: 20px; }
    .status-badge.error { background: rgba(235, 87, 87, 0.15); color: #eb5757; border-color: rgba(235, 87, 87, 0.4); }

    main { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
    .tab-content { display: none; flex: 1; flex-direction: column; height: 100%; overflow-y: auto; padding: 10px; gap: 8px; }
    .tab-content.active { display: flex; }

    .toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 8px 10px; gap: 6px; }
    .cal-btn { background: var(--card-sub); border: 1px solid var(--border-color); color: var(--text-main); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
    .cal-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .cal-btn:hover:not(:disabled) { border-color: var(--accent-gold); color: var(--accent-gold); }
    .cal-btn.primary { background: var(--accent-gold); color: #000; font-weight: bold; border-color: var(--accent-gold); }

    .table-container { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; overflow: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.3); flex: 1; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; text-align: right; }
    th { background: var(--card-sub); color: var(--accent-gold); padding: 10px 8px; font-size: 0.82rem; border-bottom: 1px solid var(--border-color); border-left: 1px solid var(--border-color); white-space: nowrap; text-align: center; }
    td { padding: 6px 6px; border-bottom: 1px solid var(--border-color); border-left: 1px solid var(--border-color); font-size: 0.82rem; white-space: nowrap; }

    .sticky-col {
      position: sticky;
      right: 0;
      background: var(--card-bg);
      z-index: 2;
      font-weight: bold;
      border-left: 2px solid var(--accent-gold);
    }
    th.sticky-col {
      background: var(--card-sub);
      z-index: 3;
    }

    .cell-input {
      width: 100%;
      min-width: 95px;
      height: 36px;
      background: #111620 !important;
      border: 1px solid #364254 !important;
      border-radius: 6px;
      color: #fff !important;
      padding: 6px 8px;
      font-size: 0.85rem;
      outline: none;
      text-align: center;
      display: block;
    }
    .cell-input:focus {
      border-color: var(--accent-gold) !important;
      box-shadow: 0 0 6px rgba(212, 175, 55, 0.5);
    }

    .double-cell {
      display: flex;
      align-items: center;
      gap: 5px;
      justify-content: center;
      min-width: 120px;
    }

    .btn-attendance {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      border: 1px solid #364254;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      user-select: none;
    }
    .btn-attendance:disabled, .day-sub-input:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      background: #0d1017 !important;
    }
    .btn-attendance.present {
      background: rgba(46, 204, 113, 0.25);
      color: var(--present-color);
      border-color: var(--present-color);
    }
    .btn-attendance.absent {
      background: rgba(231, 76, 60, 0.25);
      color: var(--absent-color);
      border-color: var(--absent-color);
    }

    /* حقل مبالغ السحبيات مع إخفاء الأسهم وتوسيع العرض */
    .day-sub-input {
      width: 65px;
      height: 34px;
      background: #111620;
      border: 1px solid #364254;
      border-radius: 6px;
      color: #fff;
      font-size: 0.85rem;
      text-align: center;
      outline: none;
      -moz-appearance: textfield;
    }
    .day-sub-input::-webkit-outer-spin-button,
    .day-sub-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .day-sub-input:focus {
      border-color: var(--accent-gold);
      box-shadow: 0 0 5px rgba(212, 175, 55, 0.4);
    }

    .chat-wrapper { display: flex; flex-direction: column; height: 100%; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
    .chat-messages { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .chat-bubble { max-width: 85%; padding: 10px 14px; border-radius: 10px; font-size: 0.85rem; line-height: 1.5; white-space: pre-wrap; }
    .chat-bubble.bot { align-self: flex-start; background: var(--bubble-bot); border: 1px solid var(--border-color); border-right: 3px solid var(--accent-gold); }
    .chat-bubble.user { align-self: flex-end; background: var(--bubble-user); border: 1px solid rgba(212,175,55,0.3); }
    .chat-input-bar { padding: 8px; background: var(--card-sub); border-top: 1px solid var(--border-color); display: flex; gap: 6px; }
    .chat-input-bar input { flex: 1; background: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 6px; color: #fff; padding: 8px 10px; outline: none; }
    .chat-input-bar button { background: var(--accent-gold); border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }

    nav.bottom-nav { background: var(--card-bg); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 6px 0; }
    .nav-btn { background: none; border: none; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; font-size: 0.75rem; }
    .nav-btn.active { color: var(--accent-gold); font-weight: bold; }
    .nav-icon { font-size: 1.15rem; }
  </style>
</head>
<body>

  <header>
    <div class="header-title">نظام الحسابات والعمالة اليومية</div>
    <div class="status-badge" id="syncStatus">جارٍ المزامنة...</div>
  </header>

  <main>
    <!-- تبويب الحسابات -->
    <section id="accountsTab" class="tab-content active">
      <div class="toolbar">
        <div style="display:flex; gap:6px;">
          <button class="cal-btn" id="prevWeekBtnAcc" onclick="changeWeek(-1)" disabled>◀ السابق</button>
          <button class="cal-btn" onclick="resetWeek()">الحالي</button>
          <button class="cal-btn" onclick="changeWeek(1)">التالي ▶</button>
        </div>
        <div id="weekRangeLabelAccounts" style="font-weight:bold; color:var(--accent-gold); font-size:0.85rem;"></div>
        <button class="cal-btn primary" onclick="addAccountRow()">+ سطر حساب</button>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th class="sticky-col">اليوم والتاريخ</th>
              <th>رقم الفاتورة/السند</th>
              <th>البيان</th>
              <th>الكمية</th>
              <th>فواتير آجلة</th>
              <th>المصروف</th>
              <th>المقبوضات</th>
              <th>الخرج</th>
            </tr>
          </thead>
          <tbody id="accountsBody"></tbody>
        </table>
      </div>
    </section>

    <!-- تبويب العمال -->
    <section id="workersTab" class="tab-content">
      <div class="toolbar">
        <div style="display:flex; gap:6px;">
          <button class="cal-btn" id="prevWeekBtnWork" onclick="changeWeek(-1)" disabled>◀ السابق</button>
          <button class="cal-btn" onclick="resetWeek()">الحالي</button>
          <button class="cal-btn" onclick="changeWeek(1)">التالي ▶</button>
        </div>
        <div id="weekRangeLabelWorkers" style="font-weight:bold; color:var(--accent-gold); font-size:0.85rem;"></div>
        <div style="display:flex; gap:6px;">
          <button class="cal-btn primary" onclick="addWorkerRow()">+ إضافة عامل</button>
          <button class="cal-btn" onclick="loadSheetsData()">تحديث الشيت</button>
        </div>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr id="workersThead">
              <th class="sticky-col">اسم العامل</th>
              <th>التحضير (أيام)</th>
              <th>السحبيات</th>
            </tr>
          </thead>
          <tbody id="workersTbody"></tbody>
        </table>
      </div>
    </section>

    <!-- تبويب المساعد الذكي -->
    <section id="aiTab" class="tab-content">
      <div class="chat-wrapper">
        <div class="chat-messages" id="chatArea">
          <div class="chat-bubble bot">أهلاً بك! مساعدك المحاسبي جاهز. التحضير والسحبيات يتم ضبطها من اليوم وطالع، وكل العمليات الحسابية محدثة تلقائياً.</div>
        </div>
        <div class="chat-input-bar">
          <input type="text" id="userInput" placeholder="اسأل Gemini عن حساب أو حضور عامل محدد..." onkeydown="if(event.key === 'Enter') sendQuery()">
          <button onclick="sendQuery()">إرسال</button>
        </div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="switchTab('accountsTab', this)">
      <span class="nav-icon">📊</span>
      <span>الحسابات</span>
    </button>
    <button class="nav-btn" onclick="switchTab('workersTab', this)">
      <span class="nav-icon">👥</span>
      <span>العمال</span>
    </button>
    <button class="nav-btn" onclick="switchTab('aiTab', this)">
      <span class="nav-icon">🤖</span>
      <span>المساعد الذكي</span>
    </button>
  </nav>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxn_BaEplrtnr0s20xBdQd41e8Pc08jmcyYHgecKFTgZ_pyxv1GzuSzzPB8JsBXe71FXg/exec";
    const GEMINI_API_KEY = "AQ.Ab8RN6LHnDA7Ucx_ylbzTFLvtn3gjKgio0beDfXvvc4UarKFZw";

    let weekOffset = 0;
    let cachedAccounts = [];
    let workerList = []; 
    let attendanceData = {};

    const arabicDays = [
      { key: 'sat', name: 'السبت' },
      { key: 'sun', name: 'الأحد' },
      { key: 'mon', name: 'الإثنين' },
      { key: 'tue', name: 'الثلاثاء' },
      { key: 'wed', name: 'الأربعاء' },
      { key: 'thu', name: 'الخميس' },
      { key: 'fri', name: 'الجمعة' }
    ];

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    function getWeekDays(offset = 0) {
      const today = new Date();
      today.setHours(0,0,0,0);

      const base = new Date();
      base.setDate(base.getDate() + (offset * 7));
      const dayIndex = (base.getDay() + 1) % 7; 
      const sat = new Date(base);
      sat.setDate(base.getDate() - dayIndex);

      return arabicDays.map((d, i) => {
        const current = new Date(sat);
        current.setDate(sat.getDate() + i);
        current.setHours(0,0,0,0);
        return {
          key: d.key,
          name: d.name,
          dateStr: `${current.getMonth() + 1}/${current.getDate()}`,
          isPast: current < today
        };
      });
    }

    function renderAll() {
      const isCurrentWeek = (weekOffset === 0);
      document.getElementById('prevWeekBtnAcc').disabled = isCurrentWeek;
      document.getElementById('prevWeekBtnWork').disabled = isCurrentWeek;

      const days = getWeekDays(weekOffset);
      const label = `أسبوع: ${days[0].dateStr} إلى ${days[6].dateStr}`;
      document.getElementById('weekRangeLabelAccounts').innerText = label;
      document.getElementById('weekRangeLabelWorkers').innerText = label;

      renderAccounts(days);
      renderWorkers(days);
    }

    function renderAccounts(days) {
      const tbody = document.getElementById('accountsBody');
      tbody.innerHTML = days.map((day, rIdx) => {
        const row = cachedAccounts[rIdx + 1] || [];
        return `
          <tr>
            <td class="sticky-col">
              <strong>${day.name}</strong>
              <small style="color:var(--text-muted); display:block; font-size:0.75rem;">${day.dateStr}</small>
            </td>
            <td><input class="cell-input" placeholder="رقم الفاتورة" value="${row[1] !== undefined ? row[1] : ''}" oninput="updateAccountCell(${rIdx + 1}, 1, this.value)"></td>
            <td><input class="cell-input" placeholder="البيان" value="${row[2] !== undefined ? row[2] : ''}" oninput="updateAccountCell(${rIdx + 1}, 2, this.value)"></td>
            <td><input class="cell-input" placeholder="الكمية" value="${row[3] !== undefined ? row[3] : ''}" oninput="updateAccountCell(${rIdx + 1}, 3, this.value)"></td>
            <td><input class="cell-input" placeholder="0" value="${row[4] !== undefined ? row[4] : ''}" oninput="updateAccountCell(${rIdx + 1}, 4, this.value)"></td>
            <td><input class="cell-input" placeholder="0" value="${row[5] !== undefined ? row[5] : ''}" oninput="updateAccountCell(${rIdx + 1}, 5, this.value)"></td>
            <td><input class="cell-input" placeholder="0" value="${row[6] !== undefined ? row[6] : ''}" oninput="updateAccountCell(${rIdx + 1}, 6, this.value)"></td>
            <td><input class="cell-input" placeholder="0" value="${row[7] !== undefined ? row[7] : ''}" oninput="updateAccountCell(${rIdx + 1}, 7, this.value)"></td>
          </tr>
        `;
      }).join('');
    }

    function renderWorkers(days) {
      if (!attendanceData[weekOffset]) attendanceData[weekOffset] = {};

      const thead = document.getElementById('workersThead');
      thead.innerHTML = `
        <th class="sticky-col">اسم العامل</th>
        <th>التحضير (أيام)</th>
        <th>السحبيات</th>
        ${days.map(d => `<th>${d.name}<br><small style="color:var(--text-muted); font-size:0.7rem;">${d.dateStr}</small></th>`).join('')}
      `;

      const tbody = document.getElementById('workersTbody');
      tbody.innerHTML = workerList.map((workerName, wIdx) => {
        if (!attendanceData[weekOffset][workerName]) {
          attendanceData[weekOffset][workerName] = { days: {} };
        }
        const record = attendanceData[weekOffset][workerName];

        let presentCount = 0;
        let totalWithdrawal = 0;

        days.forEach(d => {
          if (!record.days[d.key]) record.days[d.key] = { state: '✗', amount: '' };
          const dayData = record.days[d.key];
          
          if (!d.isPast) {
            if (dayData.state === '✓') presentCount++;
            if (dayData.amount) totalWithdrawal += parseFloat(dayData.amount) || 0;
          }
        });

        return `
          <tr id="row_${wIdx}">
            <td class="sticky-col">
              <input class="cell-input" style="font-weight:bold; text-align:right;" value="${workerName}" onchange="renameWorker(${wIdx}, this.value)">
            </td>
            <td id="present_${wIdx}" style="text-align:center; font-weight:bold; color:var(--present-color); font-size: 0.9rem;">
              ${presentCount} أيام
            </td>
            <td id="total_${wIdx}" style="text-align:center; font-weight:bold; color:var(--accent-gold); font-size: 0.9rem;">
              ${totalWithdrawal > 0 ? totalWithdrawal + ' ر.س' : '0'}
            </td>
            ${days.map(d => {
              const dayData = record.days[d.key];
              const isPresent = dayData.state === '✓';
              return `
                <td>
                  <div class="double-cell">
                    <button id="btn_${wIdx}_${d.key}" class="btn-attendance ${isPresent ? 'present' : 'absent'}" 
                      ${d.isPast ? 'disabled title="يوم سابق مقفل"' : ''} 
                      onclick="toggleCellAttendance('${workerName}', '${d.key}', ${wIdx})">
                      ${isPresent ? '✓' : '✗'}
                    </button>
                    <input class="day-sub-input" type="number" placeholder="-" 
                      ${d.isPast ? 'disabled' : ''} 
                      value="${dayData.amount || ''}" 
                      oninput="updateCellWithdrawal('${workerName}', '${d.key}', this.value, ${wIdx})">
                  </div>
                </td>
              `;
            }).join('')}
          </tr>
        `;
      }).join('');
    }

    function toggleCellAttendance(workerName, dayKey, wIdx) {
      const record = attendanceData[weekOffset][workerName];
      const current = record.days[dayKey].state;
      const next = (current === '✓') ? '✗' : '✓';
      record.days[dayKey].state = next;
      
      const btn = document.getElementById(`btn_${wIdx}_${dayKey}`);
      btn.innerText = next;
      btn.className = `btn-attendance ${next === '✓' ? 'present' : 'absent'}`;

      recalcWorkerTotals(workerName, wIdx);
    }

    function updateCellWithdrawal(workerName, dayKey, val, wIdx) {
      const record = attendanceData[weekOffset][workerName];
      record.days[dayKey].amount = val;
      recalcWorkerTotals(workerName, wIdx);
    }

    function recalcWorkerTotals(workerName, wIdx) {
      const days = getWeekDays(weekOffset);
      const record = attendanceData[weekOffset][workerName];
      let presentCount = 0;
      let totalWithdrawal = 0;

      days.forEach(d => {
        const dayData = record.days[d.key] || { state: '✗', amount: '' };
        if (!d.isPast) {
          if (dayData.state === '✓') presentCount++;
          if (dayData.amount) totalWithdrawal += parseFloat(dayData.amount) || 0;
        }
      });

      const presEl = document.getElementById(`present_${wIdx}`);
      const totEl = document.getElementById(`total_${wIdx}`);
      if (presEl) presEl.innerText = `${presentCount} أيام`;
      if (totEl) totEl.innerText = totalWithdrawal > 0 ? `${totalWithdrawal} ر.س` : '0';
    }

    function renameWorker(index, newName) {
      if (!newName.trim()) return;
      const oldName = workerList[index];
      workerList[index] = newName.trim();
      if (attendanceData[weekOffset] && attendanceData[weekOffset][oldName]) {
        attendanceData[weekOffset][newName.trim()] = attendanceData[weekOffset][oldName];
        delete attendanceData[weekOffset][oldName];
      }
      renderAll();
    }

    function addWorkerRow() {
      const newName = `عامل جديد ${workerList.length + 1}`;
      workerList.push(newName);
      renderAll();
    }

    function updateAccountCell(row, col, val) {
      if (!cachedAccounts[row]) cachedAccounts[row] = [];
      cachedAccounts[row][col] = val;
    }

    function addAccountRow() {
      cachedAccounts.push(['-', '', '', '', '', '', '', '']);
      renderAccounts(getWeekDays(weekOffset));
    }

    function changeWeek(dir) {
      if (weekOffset + dir < 0) return;
      weekOffset += dir;
      renderAll();
    }

    function resetWeek() {
      weekOffset = 0;
      renderAll();
    }

    async function loadSheetsData() {
      const badge = document.getElementById('syncStatus');
      badge.innerText = "جارٍ التحميل...";
      badge.classList.remove('error');

      try {
        const res = await fetch(SCRIPT_URL, {
          method: "GET",
          redirect: "follow",
          headers: { "Content-Type": "text/plain;charset=utf-8" }
        });
        const data = await res.json();
        cachedAccounts = data.accounts || [];
        
        if (data.workers && data.workers.length > 1) {
          workerList = data.workers.slice(1).map(r => r[0]).filter(Boolean);
        } else if (workerList.length === 0) {
          workerList = ["مصطفى", "ضياء", "عمر", "محمد الكحيلي", "وليد", "محمد وليد", "صهيب", "محمد عبده", "أحمد"];
        }

        renderAll();
        badge.innerText = "متصل ومحدث بالكامل";
      } catch (e) {
        console.error(e);
        badge.innerText = "خطأ في التحديث";
        badge.classList.add('error');
        renderAll();
      }
    }

    async function sendQuery() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      const chat = document.getElementById('chatArea');
      chat.innerHTML += `<div class="chat-bubble user">${text}</div>`;
      input.value = '';
      chat.scrollTop = chat.scrollHeight;

      const tempId = "gemini_" + Date.now();
      chat.innerHTML += `<div class="chat-bubble bot" id="${tempId}">جارٍ تدقيق الحسابات والرد عبر Gemini...</div>`;
      chat.scrollTop = chat.scrollHeight;

      const currentDays = getWeekDays(weekOffset);
      const activeRange = `الأسبوع المحدد حالياً: من ${currentDays[0].name} (${currentDays[0].dateStr}) إلى ${currentDays[6].name} (${currentDays[6].dateStr})`;

      try {
        const prompt = `
أنت محاسب مالي خبير.
نطاق الحسابات النشط: ${activeRange}

[سجلات الحسابات]:
${JSON.stringify(cachedAccounts)}

[سجل العمال والتحضير والسحبيات (من اليوم وطالع فقط)]:
${JSON.stringify(attendanceData[weekOffset] || {})}

سؤال المستخدم: "${text}"

المطلوب:
1. إعطاء إجابة محاسبية دقيقة ومباشرة بناءً على الأرقام.
2. تتبع وحساب غيابات وحضور وتفاصيل سحبيات أي عامل.
3. الرد بأسلوب واضح باللغة العربية.
        `;
